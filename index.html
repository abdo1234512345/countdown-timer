<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⏳ العد التنازلي</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Cairo', sans-serif;
            background: #0f0f23;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px 16px;
            overflow-x: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
            width: 100%;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #e94560;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 13px;
            color: #888;
        }

        .dates-card {
            background: #1a1a2e;
            border-radius: 16px;
            padding: 14px 20px;
            width: 100%;
            max-width: 380px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #2a2a4e;
        }

        .date-item {
            text-align: center;
        }

        .date-item .label {
            font-size: 10px;
            color: #666;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .date-item .value {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }

        .date-arrow {
            color: #e94560;
            font-size: 18px;
        }

        .big-days {
            text-align: center;
            margin-bottom: 20px;
        }

        .big-days .number {
            font-size: 72px;
            font-weight: 900;
            color: #e94560;
            line-height: 1;
            text-shadow: 0 0 20px rgba(233, 69, 96, 0.3);
        }

        .big-days .text {
            font-size: 16px;
            color: #aaa;
            margin-top: 4px;
        }

        .timer-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 380px;
            margin-bottom: 24px;
        }

        .timer-box {
            background: #1a1a2e;
            border-radius: 14px;
            padding: 14px 8px;
            text-align: center;
            border: 1px solid #2a2a4e;
        }

        .timer-box .num {
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            display: block;
            line-height: 1;
        }

        .timer-box .label {
            font-size: 11px;
            color: #666;
            margin-top: 6px;
            text-transform: uppercase;
        }

        .progress-section {
            width: 100%;
            max-width: 380px;
            margin-bottom: 20px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 12px;
            color: #888;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #1a1a2e;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            border-radius: 10px;
            transition: width 1s ease;
            box-shadow: 0 0 8px rgba(233, 69, 96, 0.4);
        }

        .status {
            text-align: center;
            padding: 14px 20px;
            border-radius: 14px;
            background: rgba(233, 69, 96, 0.1);
            border: 1px solid rgba(233, 69, 96, 0.3);
            width: 100%;
            max-width: 380px;
            display: none;
            font-size: 14px;
            font-weight: 600;
        }

        .status.active {
            display: block;
        }

        .footer {
            margin-top: auto;
            padding-top: 20px;
            text-align: center;
            font-size: 11px;
            color: #444;
        }

        /* Animation for numbers */
        @keyframes pulse-num {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .timer-box .num {
            animation: pulse-num 2s infinite;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>⏳ العد التنازلي</h1>
        <p>200 يوم من الأهداف والإنجازات</p>
    </div>

    <div class="dates-card">
        <div class="date-item">
            <div class="label">من</div>
            <div class="value">19/8/2026</div>
        </div>
        <div class="date-arrow">➜</div>
        <div class="date-item">
            <div class="label">إلى</div>
            <div class="value">6/3/2027</div>
        </div>
    </div>

    <div class="big-days">
        <div class="number" id="bigDays">200</div>
        <div class="text">يوم متبقي</div>
    </div>

    <div class="timer-grid">
        <div class="timer-box">
            <span class="num" id="days">00</span>
            <div class="label">يوم</div>
        </div>
        <div class="timer-box">
            <span class="num" id="hours">00</span>
            <div class="label">ساعة</div>
        </div>
        <div class="timer-box">
            <span class="num" id="minutes">00</span>
            <div class="label">دقيقة</div>
        </div>
        <div class="timer-box">
            <span class="num" id="seconds">00</span>
            <div class="label">ثانية</div>
        </div>
    </div>

    <div class="progress-section">
        <div class="progress-header">
            <span>التقدم</span>
            <span id="progressText">0%</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressBar" style="width: 0%"></div>
        </div>
    </div>

    <div class="status" id="status">
        🎉 وصلنا للهدف! انتهى العد التنازلي!
    </div>

    <div class="footer">
        <p>💡 يتحدث تلقائياً كل ثانية</p>
    </div>

    <script>
        const START_DATE = new Date('2026-08-19T00:00:00');
        const END_DATE = new Date('2027-03-06T00:00:00');
        const TOTAL_DURATION = END_DATE - START_DATE;

        const els = {
            days: document.getElementById('days'),
            hours: document.getElementById('hours'),
            minutes: document.getElementById('minutes'),
            seconds: document.getElementById('seconds'),
            bigDays: document.getElementById('bigDays'),
            progressBar: document.getElementById('progressBar'),
            progressText: document.getElementById('progressText'),
            status: document.getElementById('status')
        };

        function updateCountdown() {
            const now = new Date();
            const remaining = END_DATE - now;

            if (remaining <= 0) {
                els.days.textContent = '00';
                els.hours.textContent = '00';
                els.minutes.textContent = '00';
                els.seconds.textContent = '00';
                els.bigDays.textContent = '0';
                els.progressBar.style.width = '100%';
                els.progressText.textContent = '100%';
                els.status.classList.add('active');
                return;
            }

            const days = Math.floor(remaining / (1000 * 60 * 60 * 24));
            const hours = Math.floor((remaining % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((remaining % (1000 * 60)) / 1000);

            els.days.textContent = String(days).padStart(2, '0');
            els.hours.textContent = String(hours).padStart(2, '0');
            els.minutes.textContent = String(minutes).padStart(2, '0');
            els.seconds.textContent = String(seconds).padStart(2, '0');
            els.bigDays.textContent = days;

            const elapsed = now - START_DATE;
            const progress = Math.max(0, Math.min(100, (elapsed / TOTAL_DURATION) * 100));
            els.progressBar.style.width = progress + '%';
            els.progressText.textContent = progress.toFixed(1) + '%';
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>

</body>
</html>
