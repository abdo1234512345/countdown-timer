<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⏳ العد التنازلي</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #e94560;
            --primary-light: #ff6b6b;
            --secondary: #feca57;
            --bg: #0a0a1a;
            --card: #12122a;
            --card-border: #1e1e3f;
            --text: #ffffff;
            --text-muted: #8b8b9e;
            --success: #00d9a5;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Cairo', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 24px 16px;
            overflow-x: hidden;
            position: relative;
        }

        /* خلفية متحركة */
        .bg-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: float-shape 20s infinite ease-in-out;
        }

        .shape-1 {
            width: 300px;
            height: 300px;
            background: var(--primary);
            top: -10%;
            right: -10%;
            animation-delay: 0s;
        }

        .shape-2 {
            width: 250px;
            height: 250px;
            background: var(--secondary);
            bottom: 10%;
            left: -10%;
            animation-delay: -7s;
        }

        .shape-3 {
            width: 200px;
            height: 200px;
            background: #7c3aed;
            top: 40%;
            left: 50%;
            animation-delay: -14s;
        }

        @keyframes float-shape {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 28px;
            width: 100%;
            animation: fade-in-down 0.8s ease-out;
        }

        .header-icon {
            font-size: 40px;
            margin-bottom: 8px;
            display: inline-block;
            animation: bounce 2s infinite;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Dates Card */
        .dates-card {
            background: var(--card);
            border-radius: 20px;
            padding: 16px 24px;
            width: 100%;
            max-width: 380px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--card-border);
            animation: fade-in-up 0.6s ease-out 0.2s both;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .dates-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(233, 69, 96, 0.15);
            border-color: rgba(233, 69, 96, 0.3);
        }

        .date-item {
            text-align: center;
        }

        .date-item .label {
            font-size: 10px;
            color: var(--text-muted);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        .date-item .value {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
        }

        .date-arrow {
            color: var(--primary);
            font-size: 20px;
            animation: pulse-arrow 1.5s infinite;
        }

        @keyframes pulse-arrow {
            0%, 100% { transform: translateX(0); opacity: 1; }
            50% { transform: translateX(-4px); opacity: 0.6; }
        }

        /* Big Days Display */
        .big-days {
            text-align: center;
            margin-bottom: 28px;
            animation: fade-in-up 0.6s ease-out 0.4s both;
        }

        .big-days-wrapper {
            position: relative;
            display: inline-block;
        }

        .big-days .number {
            font-size: 80px;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, var(--primary), var(--primary-light), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            transition: transform 0.3s ease;
        }

        .big-days .number.changed {
            animation: number-pop 0.4s ease;
        }

        @keyframes number-pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .big-days .text {
            font-size: 16px;
            color: var(--text-muted);
            margin-top: 8px;
            font-weight: 500;
        }

        .glow-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            border: 2px solid rgba(233, 69, 96, 0.1);
            border-radius: 50%;
            animation: ring-pulse 3s infinite;
            pointer-events: none;
        }

        @keyframes ring-pulse {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
        }

        /* Timer Grid */
        .timer-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 380px;
            margin-bottom: 28px;
            animation: fade-in-up 0.6s ease-out 0.6s both;
        }

        .timer-box {
            background: var(--card);
            border-radius: 16px;
            padding: 16px 6px;
            text-align: center;
            border: 1px solid var(--card-border);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .timer-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease;
        }

        .timer-box:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(233, 69, 96, 0.2);
            border-color: rgba(233, 69, 96, 0.3);
        }

        .timer-box:hover::before {
            transform: scaleX(1);
        }

        .timer-box .num {
            font-size: 26px;
            font-weight: 800;
            color: var(--text);
            display: block;
            line-height: 1;
            transition: all 0.3s ease;
            font-variant-numeric: tabular-nums;
        }

        .timer-box .num.flip {
            animation: flip-num 0.5s ease;
        }

        @keyframes flip-num {
            0% { transform: rotateX(0); opacity: 1; }
            50% { transform: rotateX(90deg); opacity: 0; }
            100% { transform: rotateX(0); opacity: 1; }
        }

        .timer-box .label {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* Progress Section */
        .progress-section {
            width: 100%;
            max-width: 380px;
            margin-bottom: 24px;
            animation: fade-in-up 0.6s ease-out 0.8s both;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 12px;
            font-weight: 600;
        }

        .progress-header span:first-child {
            color: var(--text-muted);
        }

        .progress-header span:last-child {
            color: var(--primary);
            transition: color 0.3s ease;
        }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background: var(--card);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            border: 1px solid var(--card-border);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--primary-light), var(--secondary));
            border-radius: 10px;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            box-shadow: 0 0 12px rgba(233, 69, 96, 0.4);
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .progress-glow {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 14px;
            height: 14px;
            background: var(--secondary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--secondary), 0 0 20px var(--secondary);
            transition: left 1s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2;
        }

        /* Status Message */
        .status {
            text-align: center;
            padding: 16px 24px;
            border-radius: 16px;
            background: rgba(0, 217, 165, 0.1);
            border: 1px solid rgba(0, 217, 165, 0.3);
            width: 100%;
            max-width: 380px;
            display: none;
            font-size: 14px;
            font-weight: 700;
            color: var(--success);
            animation: fade-in-up 0.5s ease;
            backdrop-filter: blur(10px);
        }

        .status.active {
            display: block;
            animation: celebrate 0.6s ease;
        }

        @keyframes celebrate {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Footer */
        .footer {
            margin-top: auto;
            padding-top: 24px;
            text-align: center;
            animation: fade-in 1s ease-out 1s both;
        }

        .footer p {
            font-size: 11px;
            color: #3d3d5c;
            font-weight: 500;
        }

        .live-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--success);
            border-radius: 50%;
            margin-left: 6px;
            animation: blink 1.5s infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Keyframes */
        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fade-in-down {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* Responsive tweaks */
        @media (max-width: 360px) {
            .timer-grid { gap: 8px; }
            .timer-box { padding: 14px 4px; }
            .timer-box .num { font-size: 22px; }
            .big-days .number { font-size: 64px; }
        }
    </style>
</head>
<body>

    <!-- Background Shapes -->
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <!-- Header -->
    <div class="header">
        <div class="header-icon">⏳</div>
        <h1>العد التنازلي</h1>
        <p>200 يوم من الأهداف والإنجازات</p>
    </div>

    <!-- Dates -->
    <div class="dates-card">
        <div class="date-item">
            <div class="label">من</div>
            <div class="value">19 أغسطس 2026</div>
        </div>
        <div class="date-arrow">➜</div>
        <div class="date-item">
            <div class="label">إلى</div>
            <div class="value">6 مارس 2027</div>
        </div>
    </div>

    <!-- Big Days -->
    <div class="big-days">
        <div class="big-days-wrapper">
            <div class="glow-ring"></div>
            <div class="number" id="bigDays">200</div>
        </div>
        <div class="text">يوم متبقي</div>
    </div>

    <!-- Timer Grid -->
    <div class="timer-grid">
        <div class="timer-box">
            <span class="num" id="days">00</span>
            <div class="label">يوم</div>
        </div>
        <div class="timer-box">
            <span class="num" id="hours">00</span>
            <div class="label">ساعة</div>
        </div>
        <div class="timer-box">
            <span class="num" id="minutes">00</span>
            <div class="label">دقيقة</div>
        </div>
        <div class="timer-box">
            <span class="num" id="seconds">00</span>
            <div class="label">ثانية</div>
        </div>
    </div>

    <!-- Progress -->
    <div class="progress-section">
        <div class="progress-header">
            <span>نسبة الإنجاز</span>
            <span id="progressText">0%</span>
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar" style="width: 0%">
                <div class="progress-glow" id="progressGlow"></div>
            </div>
        </div>
    </div>

    <!-- Status -->
    <div class="status" id="status">
        🎉 وصلنا للهدف! انتهى العد التنازلي!
    </div>

    <!-- Footer -->
    <div class="footer">
        <p>يتحدث تلقائياً <span class="live-dot"></span></p>
    </div>

    <script>
        const START_DATE = new Date('2026-08-19T00:00:00');
        const END_DATE = new Date('2027-03-06T00:00:00');
        const TOTAL_DURATION = END_DATE - START_DATE;

        const els = {
            days: document.getElementById('days'),
            hours: document.getElementById('hours'),
            minutes: document.getElementById('minutes'),
            seconds: document.getElementById('seconds'),
            bigDays: document.getElementById('bigDays'),
            progressBar: document.getElementById('progressBar'),
            progressGlow: document.getElementById('progressGlow'),
            progressText: document.getElementById('progressText'),
            status: document.getElementById('status')
        };

        let prevValues = {};

        function updateCountdown() {
            const now = new Date();
            const remaining = END_DATE - now;

            if (remaining <= 0) {
                ['days','hours','minutes','seconds'].forEach(id => {
                    els[id].textContent = '00';
                });
                els.bigDays.textContent = '0';
                els.progressBar.style.width = '100%';
                els.progressGlow.style.left = 'calc(100% - 5px)';
                els.progressText.textContent = '100%';
                els.status.classList.add('active');
                return;
            }

            const days = Math.floor(remaining / (1000 * 60 * 60 * 24));
            const hours = Math.floor((remaining % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((remaining % (1000 * 60)) / 1000);

            // Update with animation
            updateValue('days', days);
            updateValue('hours', hours);
            updateValue('minutes', minutes);
            updateValue('seconds', seconds);

            // Big days with pop effect
            if (prevValues['bigDays'] !== days) {
                els.bigDays.textContent = days;
                els.bigDays.classList.add('changed');
                setTimeout(() => els.bigDays.classList.remove('changed'), 400);
                prevValues['bigDays'] = days;
            }

            // Progress
            const elapsed = now - START_DATE;
            const progress = Math.max(0, Math.min(100, (elapsed / TOTAL_DURATION) * 100));
            els.progressBar.style.width = progress + '%';
            els.progressGlow.style.left = `calc(${progress}% - 5px)`;
            els.progressText.textContent = progress.toFixed(1) + '%';
        }

        function updateValue(id, value) {
            const strValue = String(value).padStart(2, '0');
            if (prevValues[id] !== strValue) {
                els[id].classList.add('flip');
                setTimeout(() => {
                    els[id].textContent = strValue;
                }, 250);
                setTimeout(() => {
                    els[id].classList.remove('flip');
                }, 500);
                prevValues[id] = strValue;
            }
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>

</body>
</html>
