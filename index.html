<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⏳ Countdown Ultra</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap');

        :root {
            --primary: #ff2e63;
            --primary-glow: rgba(255, 46, 99, 0.4);
            --secondary: #08d9d6;
            --accent: #eaeaea;
            --bg-deep: #050510;
            --bg-surface: rgba(255, 255, 255, 0.03);
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-muted: rgba(255, 255, 255, 0.35);
            --success: #00d9a5;
            --warning: #feca57;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ===== CANVAS PARTICLES ===== */
        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ===== AURORA BACKGROUND ===== */
        .aurora {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .aurora-band {
            position: absolute;
            width: 200%;
            height: 60%;
            filter: blur(100px);
            opacity: 0.15;
            animation: aurora-move 20s infinite ease-in-out;
        }

        .aurora-1 {
            background: linear-gradient(90deg, var(--primary), transparent, var(--secondary));
            top: -20%;
            left: -50%;
            animation-delay: 0s;
        }

        .aurora-2 {
            background: linear-gradient(90deg, var(--secondary), transparent, var(--primary));
            top: 30%;
            left: -30%;
            animation-delay: -7s;
            animation-duration: 25s;
        }

        .aurora-3 {
            background: linear-gradient(90deg, #7c3aed, transparent, var(--primary));
            top: 60%;
            left: -40%;
            animation-delay: -14s;
            animation-duration: 22s;
        }

        @keyframes aurora-move {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            33% { transform: translateX(10%) rotate(2deg); }
            66% { transform: translateX(-5%) rotate(-1deg); }
        }

        /* ===== MAIN CONTAINER ===== */
        .app {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 32px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        /* ===== LOADING SCREEN ===== */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-deep);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .loader.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loader-ring {
            width: 60px;
            height: 60px;
            border: 3px solid transparent;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loader-text {
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-secondary);
            letter-spacing: 4px;
            text-transform: uppercase;
            animation: pulse-text 1.5s infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes pulse-text {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            animation: fade-in-up 1s ease-out 0.3s both;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 16px;
            backdrop-filter: blur(10px);
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--primary-glow);
            animation: blink 2s infinite;
        }

        .title {
            font-size: 28px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 8px;
        }

        .title-gradient {
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--primary));
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient-shift 5s ease infinite;
        }

        @keyframes gradient-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* ===== DATES CARD ===== */
        .dates-card {
            width: 100%;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fade-in-up 1s ease-out 0.5s both;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .dates-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            animation: shimmer-sweep 3s infinite;
        }

        @keyframes shimmer-sweep {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .dates-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 46, 99, 0.2);
            box-shadow: 0 20px 40px rgba(255, 46, 99, 0.1);
        }

        .date-block {
            text-align: center;
            flex: 1;
        }

        .date-block .label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .date-block .value {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .date-arrow {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 12px;
            font-size: 16px;
            animation: float-arrow 2s ease-in-out infinite;
            box-shadow: 0 4px 15px rgba(255, 46, 99, 0.3);
        }

        @keyframes float-arrow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        /* ===== HERO DAYS ===== */
        .hero-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fade-in-up 1s ease-out 0.7s both;
        }

        .hero-ring-container {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .progress-ring-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .progress-ring-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.05);
            stroke-width: 8;
        }

        .progress-ring-fill {
            fill: none;
            stroke: url(#gradient);
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 628;
            stroke-dashoffset: 628;
            transition: stroke-dashoffset 1s cubic-bezier(0.4, 0, 0.2, 1);
            filter: drop-shadow(0 0 6px rgba(255, 46, 99, 0.5));
        }

        .hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .hero-number {
            font-size: 72px;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(180deg, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            transition: transform 0.3s ease;
            font-variant-numeric: tabular-nums;
        }

        .hero-number.pop {
            animation: number-pop 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes number-pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .hero-label {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 4px;
            font-weight: 500;
        }

        .hero-glow {
            position: absolute;
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, rgba(255, 46, 99, 0.15), transparent 70%);
            border-radius: 50%;
            animation: pulse-glow 3s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }

        /* ===== TIMER GRID ===== */
        .timer-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            animation: fade-in-up 1s ease-out 0.9s both;
        }

        .timer-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px 8px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .timer-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            transform: scaleX(0);
            transition: transform 0.4s ease;
        }

        .timer-card:hover::after {
            transform: scaleX(1);
        }

        .timer-card:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: rgba(255, 46, 99, 0.2);
            box-shadow: 0 16px 32px rgba(255, 46, 99, 0.15);
        }

        .timer-card:active {
            transform: scale(0.98);
        }

        .timer-value {
            font-size: 28px;
            font-weight: 800;
            color: var(--text-primary);
            display: block;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            transition: all 0.3s ease;
        }

        .timer-value.flip {
            animation: card-flip 0.6s ease;
        }

        @keyframes card-flip {
            0% { transform: rotateX(0); }
            50% { transform: rotateX(90deg) scale(0.8); opacity: 0; }
            100% { transform: rotateX(0) scale(1); opacity: 1; }
        }

        .timer-label {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        /* ===== LINEAR PROGRESS ===== */
        .linear-progress {
            width: 100%;
            animation: fade-in-up 1s ease-out 1.1s both;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .progress-title {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .progress-percent {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
            font-variant-numeric: tabular-nums;
        }

        .progress-track {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill-linear {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 10px;
            transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            box-shadow: 0 0 20px rgba(255, 46, 99, 0.3);
        }

        .progress-fill-linear::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: progress-shine 2s infinite;
        }

        @keyframes progress-shine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* ===== STATUS ===== */
        .status-card {
            width: 100%;
            background: linear-gradient(135deg, rgba(0, 217, 165, 0.1), rgba(0, 217, 165, 0.05));
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 217, 165, 0.2);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            display: none;
            animation: fade-in-up 0.6s ease;
        }

        .status-card.active {
            display: block;
            animation: celebrate-in 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes celebrate-in {
            0% { transform: scale(0.5) rotate(-5deg); opacity: 0; }
            60% { transform: scale(1.05) rotate(2deg); }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }

        .status-icon {
            font-size: 40px;
            margin-bottom: 8px;
            display: block;
            animation: bounce 1s infinite;
        }

        .status-text {
            font-size: 16px;
            font-weight: 700;
            color: var(--success);
        }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: auto;
            padding-top: 20px;
            text-align: center;
            animation: fade-in 1s ease-out 1.3s both;
        }

        .footer-content {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            padding: 8px 16px;
            border-radius: 100px;
            font-size: 11px;
            color: var(--text-muted);
            backdrop-filter: blur(10px);
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(0, 217, 165, 0.5);
            animation: live-pulse 1.5s infinite;
        }

        @keyframes live-pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
        }

        /* ===== RIPPLE EFFECT ===== */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: scale(0);
            animation: ripple-anim 0.6s linear;
            pointer-events: none;
        }

        @keyframes ripple-anim {
            to { transform: scale(4); opacity: 0; }
        }

        /* ===== KEYFRAMES ===== */
        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 380px) {
            .app { padding: 24px 16px; }
            .title { font-size: 24px; }
            .hero-number { font-size: 60px; }
            .hero-ring-container { width: 190px; height: 190px; }
            .timer-value { font-size: 24px; }
            .timer-grid { gap: 8px; }
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 0; }
    </style>
</head>
<body>

    <!-- SVG Gradient Definition -->
    <svg width="0" height="0" style="position:absolute">
        <defs>
            <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#ff2e63"/>
                <stop offset="100%" style="stop-color:#08d9d6"/>
            </linearGradient>
        </defs>
    </svg>

    <!-- Canvas Particles -->
    <canvas id="particles"></canvas>

    <!-- Aurora Background -->
    <div class="aurora">
        <div class="aurora-band aurora-1"></div>
        <div class="aurora-band aurora-2"></div>
        <div class="aurora-band aurora-3"></div>
    </div>

    <!-- Loading Screen -->
    <div class="loader" id="loader">
        <div class="loader-ring"></div>
        <div class="loader-text">Loading</div>
    </div>

    <!-- Main App -->
    <div class="app">

        <!-- Header -->
        <div class="header">
            <div class="badge">
                <span class="badge-dot"></span>
                <span>Live Countdown</span>
            </div>
            <h1 class="title">
                <span class="title-gradient">العد التنازلي</span>
            </h1>
            <p class="subtitle">200 يوم من الأهداف والإنجازات</p>
        </div>

        <!-- Dates -->
        <div class="dates-card">
            <div class="date-block">
                <div class="label">من</div>
                <div class="value">19 أغسطس 2026</div>
            </div>
            <div class="date-arrow">➜</div>
            <div class="date-block">
                <div class="label">إلى</div>
                <div class="value">6 مارس 2027</div>
            </div>
        </div>

        <!-- Hero Ring -->
        <div class="hero-section">
            <div class="hero-ring-container">
                <div class="hero-glow"></div>
                <svg class="progress-ring-svg" viewBox="0 0 220 220">
                    <circle class="progress-ring-bg" cx="110" cy="110" r="100"/>
                    <circle class="progress-ring-fill" id="progressRing" cx="110" cy="110" r="100"/>
                </svg>
                <div class="hero-content">
                    <div class="hero-number" id="heroDays">200</div>
                    <div class="hero-label">يوم متبقي</div>
                </div>
            </div>
        </div>

        <!-- Timer Grid -->
        <div class="timer-grid">
            <div class="timer-card" onclick="createRipple(event, this)">
                <span class="timer-value" id="days">00</span>
                <div class="timer-label">يوم</div>
            </div>
            <div class="timer-card" onclick="createRipple(event, this)">
                <span class="timer-value" id="hours">00</span>
                <div class="timer-label">ساعة</div>
            </div>
            <div class="timer-card" onclick="createRipple(event, this)">
                <span class="timer-value" id="minutes">00</span>
                <div class="timer-label">دقيقة</div>
            </div>
            <div class="timer-card" onclick="createRipple(event, this)">
                <span class="timer-value" id="seconds">00</span>
                <div class="timer-label">ثانية</div>
            </div>
        </div>

        <!-- Linear Progress -->
        <div class="linear-progress">
            <div class="progress-header">
                <span class="progress-title">نسبة الإنجاز</span>
                <span class="progress-percent" id="progressPercent">0.0%</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill-linear" id="progressBar" style="width: 0%"></div>
            </div>
        </div>

        <!-- Status -->
        <div class="status-card" id="status">
            <span class="status-icon">🎉</span>
            <div class="status-text">وصلنا للهدف! انتهى العد التنازلي!</div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="footer-content">
                <div class="live-indicator">
                    <span class="live-dot"></span>
                    <span>Live</span>
                </div>
                <span>•</span>
                <span>يتحدث كل ثانية</span>
            </div>
        </div>

    </div>

    <script>
        // ===== CONFIG =====
        const START_DATE = new Date('2026-08-19T00:00:00');
        const END_DATE = new Date('2027-03-06T00:00:00');
        const TOTAL_DURATION = END_DATE - START_DATE;
        const CIRCUMFERENCE = 2 * Math.PI * 100; // r=100

        // ===== DOM =====
        const els = {
            loader: document.getElementById('loader'),
            days: document.getElementById('days'),
            hours: document.getElementById('hours'),
            minutes: document.getElementById('minutes'),
            seconds: document.getElementById('seconds'),
            heroDays: document.getElementById('heroDays'),
            progressRing: document.getElementById('progressRing'),
            progressBar: document.getElementById('progressBar'),
            progressPercent: document.getElementById('progressPercent'),
            status: document.getElementById('status')
        };

        let prevValues = {};

        // ===== PARTICLES SYSTEM =====
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let mouseX = 0, mouseY = 0;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random() * 0.5 + 0.1;
                this.color = Math.random() > 0.5 ? '255, 46, 99' : '8, 217, 214';
            }

            update() {
                // Mouse repulsion
                const dx = this.x - mouseX;
                const dy = this.y - mouseY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 100) {
                    const force = (100 - dist) / 100;
                    this.x += dx * force * 0.02;
                    this.y += dy * force * 0.02;
                }

                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${this.color}, ${this.opacity})`;
                ctx.fill();
            }
        }

        // Create particles
        for (let i = 0; i < 60; i++) {
            particles.push(new Particle());
        }

        // Connect particles
        function connectParticles() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 120) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(255, 46, 99, ${0.1 * (1 - dist / 120)})`;
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            connectParticles();
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // Mouse tracking
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        // Touch tracking
        document.addEventListener('touchmove', (e) => {
            mouseX = e.touches[0].clientX;
            mouseY = e.touches[0].clientY;
        });

        // ===== RIPPLE EFFECT =====
        function createRipple(e, element) {
            const ripple = document.createElement('span');
            ripple.classList.add('ripple');
            
            const rect = element.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            const x = e.clientX - rect.left - size / 2;
            const y = e.clientY - rect.top - size / 2;
            
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            
            element.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        }

        // ===== COUNTDOWN LOGIC =====
        function updateCountdown() {
            const now = new Date();
            const remaining = END_DATE - now;

            if (remaining <= 0) {
                ['days','hours','minutes','seconds'].forEach(id => {
                    els[id].textContent = '00';
                });
                els.heroDays.textContent = '0';
                els.progressRing.style.strokeDashoffset = 0;
                els.progressBar.style.width = '100%';
                els.progressPercent.textContent = '100.0%';
                els.status.classList.add('active');
                return;
            }

            const days = Math.floor(remaining / (1000 * 60 * 60 * 24));
            const hours = Math.floor((remaining % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((remaining % (1000 * 60)) / 1000);

            // Update timer cards with flip
            updateValue('days', days);
            updateValue('hours', hours);
            updateValue('minutes', minutes);
            updateValue('seconds', seconds);

            // Update hero days with pop
            if (prevValues['heroDays'] !== days) {
                els.heroDays.textContent = days;
                els.heroDays.classList.add('pop');
                setTimeout(() => els.heroDays.classList.remove('pop'), 500);
                prevValues['heroDays'] = days;
            }

            // Progress calculations
            const elapsed = now - START_DATE;
            const progress = Math.max(0, Math.min(100, (elapsed / TOTAL_DURATION) * 100));
            const ringOffset = CIRCUMFERENCE - (progress / 100) * CIRCUMFERENCE;

            // Update ring
            els.progressRing.style.strokeDashoffset = ringOffset;

            // Update linear bar
            els.progressBar.style.width = progress + '%';
            els.progressPercent.textContent = progress.toFixed(1) + '%';
        }

        function updateValue(id, value) {
            const strValue = String(value).padStart(2, '0');
            if (prevValues[id] !== strValue) {
                els[id].classList.add('flip');
                setTimeout(() => {
                    els[id].textContent = strValue;
                }, 300);
                setTimeout(() => {
                    els[id].classList.remove('flip');
                }, 600);
                prevValues[id] = strValue;
            }
        }

        // ===== INIT =====
        window.addEventListener('load', () => {
            setTimeout(() => {
                els.loader.classList.add('hidden');
            }, 1000);
        });

        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
